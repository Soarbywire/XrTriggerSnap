# XrTriggerSnap settings.
# Easiest to change from the tray app (right-click the icon > Settings).
# Changes made here or in the tray app apply within a second, even mid-flight.

# 1 = active, 0 = pass everything through untouched (layer still logs).
enabled = 1

# both | left | right  - which hand(s) to apply this to.
hands = both

# --- Hand skeleton pinch (what X-Plane uses for bare-hand tracking) ---
# X-Plane works out the pinch from where your thumb and index fingertips are.
# The layer reports any half-closed pinch as a fully open hand, so the laser
# never gets its "half pressed" state. Distances are thumb tip to index tip, in cm.
joint_snap = 1
# Closer than this counts as a pinch (click). Touching fingertips track at about
# 1-1.5 cm: lower = harder to pinch by accident, too low and pinches won't register.
joint_close_cm = 1.1
# Once pinched, stays pinched until the fingers open wider than this.
joint_release_cm = 3.0
# Anything between closed and this is reported as this distance (open hand).
joint_open_cm = 7.0
# Distance reported while pinched.
joint_pinched_cm = 0.5
# Quick, deliberate pinches pass your real finger positions straight through, so the pinch
# lands exactly where your fingers are. Only slow drift and resting near-pinches are hidden.
# 0 = hide every half pinch (1.0.0 behaviour; less accurate on small targets).
fast_pinch = 1
# How fast the thumb-index gap must close to count as a quick pinch.
fast_pinch_speed_cm_s = 10

# --- Controllers / runtimes that report a 0-1 trigger or pinch value ---
# Value must reach press_threshold to click; stays clicked until below release_threshold.
press_threshold = 0.90
release_threshold = 0.60
# Binding paths (suffix match) whose float values get snapped to 0 or 1.
float_paths = /input/trigger/value, /input/pinch_ext/value, /input/aim_activate_ext/value, /input/select/value
# Force "finger touching trigger" inputs to off (some apps show the laser on touch).
suppress_touch = 1
touch_paths = /input/trigger/touch

# Start the tray app (XrTriggerSnap.exe) automatically when X-Plane starts VR.
launch_tray = 1

# Check GitHub for a newer version shortly after the tray app starts and every 6 hours.
check_updates = 1
# Download, verify and install new versions automatically (only while X-Plane isn't in VR).
# This file is never replaced by an update.
auto_update = 1

# 0 = no log, 1 = setup info and pinches, 2 = also every trigger value change.
# The log is trigger_snap.log in this folder (or %TEMP% if this folder isn't writable).
log_level = 1
