# Builds and publishes a GitHub release for the version in version.h.
#
# Runs when version.h (or this workflow) changes on main, when a v* tag is pushed, or by hand
# from the Actions tab. If a release for that version already exists it does nothing, so
# re-runs are harmless. The tray app's updater looks at the latest release, so publishing one
# is all it takes for installed copies to update themselves.
name: Release

on:
  push:
    branches: [main]
    paths: ["version.h", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(sed -n 's/^#define XRTS_VERSION "\(.*\)"/\1/p' version.h)"
          if [ -z "$VER" ]; then echo "::error::No XRTS_VERSION in version.h"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.h ($VER). Bump version.h first."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VER already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install MinGW-w64
        if: steps.ver.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix

      - name: Run tests
        if: steps.ver.outputs.exists == 'false'
        run: scripts/run-tests.sh

      - name: Build Windows binaries
        if: steps.ver.outputs.exists == 'false'
        run: scripts/build-windows.sh build/package

      - name: Package
        if: steps.ver.outputs.exists == 'false'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p build/release
          cd build/package
          zip -9 "../release/XrTriggerSnap-$VER.zip" XrTriggerSnap.exe XR_APILAYER_trigger_snap.dll \
            XR_APILAYER_trigger_snap.json trigger_snap.ini README.md
          # Individual files are what the updater downloads; the zip is for people.
          cp XrTriggerSnap.exe XR_APILAYER_trigger_snap.dll XR_APILAYER_trigger_snap.json README.md ../release/
          cd ../release
          sha256sum XrTriggerSnap.exe XR_APILAYER_trigger_snap.dll XR_APILAYER_trigger_snap.json README.md \
            "XrTriggerSnap-$VER.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        if: steps.ver.outputs.exists == 'false'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          awk -v v="$VER" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > build/notes.md
          if [ ! -s build/notes.md ]; then echo "XrTriggerSnap $VER" > build/notes.md; fi
          {
            echo
            echo "**Install:** download \`XrTriggerSnap-$VER.zip\`, unzip it somewhere permanent and run \`XrTriggerSnap.exe\`."
            echo "Installed copies update themselves automatically."
          } >> build/notes.md
          cat build/notes.md

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # Creates the tag at this commit if it doesn't exist yet.
          gh release create "${{ steps.ver.outputs.tag }}" build/release/* --target "$GITHUB_SHA" \
            --title "XrTriggerSnap $VER" --notes-file build/notes.md
